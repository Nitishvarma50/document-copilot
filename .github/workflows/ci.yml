name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
      UV_LINK_MODE: copy
      # Safe placeholder for tests; no production credentials are required.
      SEC_USER_AGENT: "document-copilot ci@example.invalid"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Lint Python
        run: uv run ruff check Data Backend tests main.py

      - name: Check formatting
        run: uv run ruff format --check Data Backend tests main.py

      # Backend imports currently use an application-root layout. Full backend
      # mypy coverage will be enabled after that package layout is finalized.
      - name: Type check stable Python packages
        run: uv run mypy Data main.py tests --exclude 'tests/backend'

      - name: Run tests
        run: uv run pytest

      - name: Compile Python files
        run: uv run python -m compileall -q Data Backend tests main.py

      - name: Validate Alembic migration discovery
        working-directory: Backend
        run: uv run alembic heads

  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Frontend
    env:
      # Safe placeholders: frontend CI must not contact production services.
      VITE_API_BASE_URL: http://localhost:8000
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
